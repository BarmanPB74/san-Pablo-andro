name: Build Android APK (San Pablo Medellin AI)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Capacitor Config
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f package.json ]; then
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
          else
            npm install
          fi
          if [ ! -f capacitor.config.json ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.barmanpb74.sanpabloandro",
            "appName": "San Pablo Medellin AI",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          fi

      - name: Add Android Platform & Build Debug APK
        run: |
          npx cap add android || npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanPablo-Medellin-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
